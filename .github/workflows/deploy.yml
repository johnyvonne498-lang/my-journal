name: Publish personal journal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble website from public app files
        run: |
          mkdir -p _site
          unzip -q site-assets.zip -d _site
          python - <<'PY'
          import json, pathlib, shutil
          dest = pathlib.Path('_site')
          files = json.loads(pathlib.Path('offline-files.json').read_text())['files']
          for item in files:
              name = item.removeprefix('./')
              if not name or name.startswith('assets/'):
                  continue
              shutil.copy2(name, dest / name)
          shutil.copy2('sw.js', dest / 'sw.js')
          (dest / '.nojekyll').touch()
          missing = [item for item in files if item != './' and not (dest / item.removeprefix('./')).is_file()]
          assert not missing, missing
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
